name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
