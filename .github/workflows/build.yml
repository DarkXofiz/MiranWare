name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon -q > build.log 2>&1 || echo FAIL > failed
      - name: Ozet
        if: always()
        run: |
          {
            echo "== TOPLAM SATIR: $(wc -l < build.log)"
            echo "== HATA SAYISI: $(grep -c 'error:' build.log)"
            echo "== ILK 40 SATIR"
            head -40 build.log | cut -c1-250
            echo "== EN COK HATALI DOSYALAR"
            grep 'error:' build.log | sed -E 's#^(.*/)?([^/:]+\.java):.*#\2#' | sort | uniq -c | sort -rn | head -40
            echo "== EKSIK SEMBOLLER"
            grep -E '^symbol:' build.log | sed -E 's/^symbol: +//' | sort | uniq -c | sort -rn | head -150 | cut -c1-160
            echo "== EKSIK PAKETLER"
            grep -E '^location: package' build.log | sort | uniq -c | sort -rn | head -30
            echo "== HATA TURLERI"
            grep 'error:' build.log | sed -E 's#^.*error: ##' | sort | uniq -c | sort -rn | head -40 | cut -c1-200
          } > summary.txt
          head -400 summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log
          path: |
            summary.txt
            build.log
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: ignore
      - name: Basarisizsa kirmizi yap
        run: test ! -f failed
