plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven { url = 'https://jitpack.io' }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	accessWidenerPath = file("src/main/resources/miranware.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation(files("src/main/resources/script-api.jar"))
	include implementation("org.java-websocket:Java-WebSocket:1.6.0")
	include implementation("org.eclipse.jdt:ecj:3.42.0")
	include implementation("com.fasterxml.jackson.core:jackson-annotations:2.21")
	include implementation("com.fasterxml.jackson.core:jackson-core:2.21.0")
	include implementation("com.fasterxml.jackson.core:jackson-databind:2.21.0")
	include implementation("com.fasterxml.jackson.module:jackson-module-parameter-names:2.21.0")
	include implementation("net.java.dev.jna:jna:5.17.0")
	include implementation("net.java.dev.jna:jna-platform:5.17.0")
	include implementation("com.github.bonenaut7:mediatransport4j:1.0.3")
	include implementation("com.microsoft.onnxruntime:onnxruntime:1.20.0")
	compileOnly "org.projectlombok:lombok:1.18.42"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	annotationProcessor "org.projectlombok:lombok:1.18.42"
}

